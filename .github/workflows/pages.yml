name: Publish film playback page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'docs/**'
      - 'films/**/README*.md'
      - 'films/**/docs/**'
      - 'films/**/assets/**'
      - 'films/**/release.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation renderer
        run: python -m pip install -r site/tools/requirements.txt
      - name: Build current optional English captions
        run: python site/tools/build-subtitles.py
      - name: Read selected release
        id: release
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('films/edl-gating/release.json').read_text())
          values = {'tag': release['tag'], 'video': release['video']['filename'], 'subtitles': release['subtitles']['english']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          PY
      - name: Download the selected release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VIDEO_ASSET: ${{ steps.release.outputs.video }}
          SUBTITLE_ASSET: ${{ steps.release.outputs.subtitles }}
        run: |
          mkdir -p "$RUNNER_TEMP/media"
          gh release download "$RELEASE_TAG" --pattern "$VIDEO_ASSET" --pattern "$SUBTITLE_ASSET" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/media"
      - name: Verify selected checksums and caption source
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          media = Path(os.environ['RUNNER_TEMP']) / 'media'
          release = json.loads(Path('films/edl-gating/release.json').read_text())
          selected = [release['video']['filename'], release['subtitles']['english']]
          checksums = {}
          for line in (media / 'SHA256SUMS.txt').read_text().splitlines():
              if line.strip():
                  digest, name = line.split(maxsplit=1)
                  checksums[name.lstrip('*')] = digest.lower()
          for name in selected:
              path = media / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != checksums.get(name):
                  raise SystemExit(f'Checksum mismatch or missing entry: {name}')
          if (media / release['subtitles']['english']).read_bytes() != Path('site/gallery/edl-gating.en.vtt').read_bytes():
              raise SystemExit('Published captions do not match the current film source')
          print('Both selected release assets match SHA256SUMS.txt; captions match the current source.')
          PY
      - name: Download and verify the MCP film
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/media-mcp"
          python - <<'PY' > "$RUNNER_TEMP/mcp.txt"
          import json
          from pathlib import Path
          release = json.loads(Path('films/mcp-explained/release.json').read_text())
          print(release['tag'], release['web_video']['filename'], release['web_video']['sha256'])
          PY
          read -r TAG FILE SHA < "$RUNNER_TEMP/mcp.txt"
          gh release download "$TAG" --pattern "$FILE" --dir "$RUNNER_TEMP/media-mcp"
          echo "$SHA  $RUNNER_TEMP/media-mcp/$FILE" | sha256sum -c -
          echo "MCP_VIDEO=$RUNNER_TEMP/media-mcp/$FILE" >> "$GITHUB_ENV"
      - name: Build static viewing site and verify approved video
        env:
          VIDEO_ASSET: ${{ steps.release.outputs.video }}
        run: python site/tools/prepare-gallery.py --video "$RUNNER_TEMP/media/$VIDEO_ASSET" --extra-video "$MCP_VIDEO" --out "$RUNNER_TEMP/site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
